<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#102f55" />
    <title>RIZE · Coach Flo</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 15% 5%, #7bb9ea 0, #1557a5 42%, #06162b 100%); color: #fff; }
      main { width: min(520px, 100%); padding: 36px 28px; border: 1px solid rgba(255,255,255,.18); border-radius: 28px; background: rgba(9,37,72,.82); box-shadow: 0 24px 70px rgba(0,0,0,.28); text-align: center; }
      .mark { width: 70px; height: 70px; margin: 0 auto 22px; display: grid; place-items: center; border-radius: 21px; background: linear-gradient(135deg, #ff995e, #2588e8); font-size: 34px; font-weight: 900; }
      h1 { margin: 0 0 12px; font-size: clamp(30px, 7vw, 44px); line-height: 1.05; }
      p { margin: 0; color: rgba(255,255,255,.72); font-size: 17px; line-height: 1.55; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">R</div>
      <h1>RIZE · Coach Flo</h1>
      <p>Dein täglicher Trainingsimpuls für mehr Kraft, Bewegung und Beständigkeit.</p>
    </main>
  </body>
</html>
