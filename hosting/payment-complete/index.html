<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#102f55" />
    <title>Zahlung abgeschlossen · RIZE</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); background: radial-gradient(circle at 15% 5%, #7bb9ea 0, #1557a5 42%, #06162b 100%); color: #fff; }
      main { width: min(520px, 100%); padding: 38px 28px; border: 1px solid rgba(255,255,255,.18); border-radius: 28px; background: rgba(9,37,72,.86); box-shadow: 0 24px 70px rgba(0,0,0,.28); text-align: center; }
      .check { width: 76px; height: 76px; margin: 0 auto 24px; display: grid; place-items: center; border-radius: 24px; background: linear-gradient(135deg, #ff995e, #2588e8); font-size: 42px; font-weight: 900; }
      .eyebrow { margin: 0 0 10px; color: #69d7ff; font-size: 13px; font-weight: 900; letter-spacing: .13em; text-transform: uppercase; }
      h1 { margin: 0 0 14px; font-size: clamp(30px, 7vw, 43px); line-height: 1.08; }
      p { margin: 0; color: rgba(255,255,255,.74); font-size: 17px; line-height: 1.55; }
      .hint { margin-top: 24px; padding: 15px 17px; border-radius: 16px; background: rgba(255,255,255,.08); color: rgba(255,255,255,.9); font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="check" aria-hidden="true">✓</div>
      <p class="eyebrow">RIZE Pro</p>
      <h1>Zahlung abgeschlossen</h1>
      <p>Vielen Dank! Deine Zahlung wird verarbeitet und Dein Pro-Zugang automatisch in RIZE aktiviert.</p>
      <p class="hint">Du kannst dieses Fenster jetzt schließen und zur RIZE App zurückkehren.</p>
    </main>
  </body>
</html>
